apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-identity-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass | default "default" }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
