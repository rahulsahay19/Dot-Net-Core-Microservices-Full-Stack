apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderingapi
  namespace: {{ .Release.Namespace }}
  labels:
    app: orderingapi

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: orderingapi

  template:
    metadata:
      labels:
        app: orderingapi

    spec:
      containers:
        - name: orderingapi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.ASPNETCORE_ENVIRONMENT | quote }}

            # SQL Server connection string
            - name: ConnectionStrings__OrderingConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.key }}

            # RabbitMQ (inside AKS)
            - name: EventBusSettings__HostAddress
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eventBus.secretName }}
                  key: {{ .Values.eventBus.secretKey }}
